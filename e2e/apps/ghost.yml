apiVersion: onebox.run/v1alpha1
kind: Application
metadata:
  name: ghost
spec:
  environments:
    production: {server: root@TARGET}
  workloads:
    ghost:
      role: Application
      image: ghost:5-alpine
      routes:
        - {hostname: blog.example.com, port: 2368}
      needs:
        - name: mysql
          env:
            database__connection__host: host
            database__connection__user: user
            database__connection__password: password
            database__connection__database: database
      env:
        database__client: mysql
        url: http://blog.example.com
        NODE_ENV: production
      health: {exec: "wget -qO- http://127.0.0.1:2368/ >/dev/null || exit 1", interval: 10s, startPeriod: 40s, retries: 6}
  services:
    mysql: "8.4"
