api_version: onebox.run/v1
app: gitea
environments:
  production: {server: root@TARGET}
workloads:
  server:
    role: application
    image: docker.gitea.com/gitea:1.22.6
    domain: git.example.com
    port: 3000
    needs: [db]
    published_ports: [{host: 2222, container: 22}]
    env:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: "db:5432"
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: gitea
    volumes: [{name: data, path: /data}]
  db:
    role: daemon
    image: postgres:14-alpine
    env: {POSTGRES_USER: gitea, POSTGRES_PASSWORD: gitea, POSTGRES_DB: gitea}
    volumes: [{name: data, path: /var/lib/postgresql/data}]
    health: {exec: "pg_isready -U gitea", interval: 5s, retries: 10}
