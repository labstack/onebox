apiVersion: onebox.run/v1alpha1
kind: Application
metadata:
  name: rocketchat
spec:
  environments:
    production: {server: root@TARGET}
  workloads:
    rocketchat:
      role: Application
      image: registry.rocket.chat/rocketchat/rocket.chat:7.3.0
      routes:
        - {hostname: chat.example.com, port: 3000}
      needs:
        - name: mongodb
          env: {MONGO_URL: url}
      env:
        ROOT_URL: http://chat.example.com
        PORT: "3000"
        DEPLOY_METHOD: docker
      health: {exec: "curl -fsS http://127.0.0.1:3000/api/info >/dev/null || exit 1", interval: 10s, startPeriod: 60s, retries: 10}
  services:
    mongodb: "7.0"
