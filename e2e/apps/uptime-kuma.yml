apiVersion: onebox.run/v1alpha1
kind: Application
metadata:
  name: uptime-kuma
spec:
  environments:
    production: {server: root@TARGET}
  workloads:
    uptime-kuma:
      image: louislam/uptime-kuma:1.23.16
      health: {http: /, port: 3001, interval: 10s, startPeriod: 30s, retries: 5}
      routes:
        - {hostname: kuma.example.com, port: 3001}
