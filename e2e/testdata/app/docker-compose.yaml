# Traefik + a busybox httpd "web" — the smallest thing that can prove ZDD.
services:
  traefik:
    image: traefik:v3.7 # ≥v3.5 needed: older traefik pins docker API 1.24, rejected by engine 29+
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:18080
      - --ping=true
      - --providers.docker.network=yeete2e_default
    ports: ["18080:18080"]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 2s
      start_period: 2s
  web:
    image: busybox:1.36
    command: sh -c 'mkdir -p /www && echo "$$APP_VERSION" > /www/index.html && exec httpd -f -p 8080 -h /www'
    environment:
      APP_VERSION: ${APP_VERSION:-v1}
    labels:
      - traefik.enable=true
      - traefik.http.routers.e2e.rule=PathPrefix(`/`)
      - traefik.http.routers.e2e.entrypoints=web
      - traefik.http.services.e2e.loadbalancer.server.port=8080
