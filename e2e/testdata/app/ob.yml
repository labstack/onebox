api_version: onebox.run/v1
app: obe2e
compose: docker-compose.yaml
environments:
  production: { target: local } # e2e uses LocalTransport; target value unused
components:
  web:
    type: application
    service: web
    deployment: { strategy: rolling }
    readiness: { http: /, port: 8080, interval: 1s, start_period: 1s, within: 60s }
  traefik:
    type: service
    service: traefik
deployment:
  order: [web]
verification:
  # exec (not http): on macOS the container bridge network is unreachable
  # from the host, so probe from inside the container.
  - { exec: "wget -qO- http://localhost:8080/", component: web }
