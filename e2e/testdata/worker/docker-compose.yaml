services:
  web:
    image: busybox:1.36
    command: sh -c 'mkdir -p /www && echo "$$APP_VERSION" > /www/index.html && exec httpd -f -p 8080 -h /www'
    environment:
      APP_VERSION: ${APP_VERSION:-v1}
    ports: ["18081:8080"]
  worker:
    image: busybox:1.36
    command: sh -c 'touch /marker && exec sleep 2147483647'
