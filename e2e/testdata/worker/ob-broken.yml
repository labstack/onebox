api_version: onebox.run/v1
app: obworker
environments: { production: { server: local } }
workloads:
  worker:
    role: worker
    compose: "docker-compose.yaml#worker"
    strategy: recreate
    health: { exec: "test -f /nonexistent", interval: 1s, start_period: 1s, within: 6s }
  web:
    role: application
    compose: "docker-compose.yaml#web"
    strategy: recreate
    health: { exec: "wget -qO- http://localhost:8080/", interval: 1s, start_period: 1s, within: 30s }
deployment:
  order: [worker, web]
proxy:
  managed: false
verification:
  - { exec: "wget -qO- http://localhost:8080/", workload: web }
