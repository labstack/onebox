api_version: onebox.run/v1
app: obworker
compose: docker-compose.yaml
environments: { production: { target: local } }
components:
  worker: { type: worker, service: worker, deployment: { strategy: recreate }, readiness: { exec: "test -f /nonexistent", interval: 1s, start_period: 1s, within: 6s } }
  web:    { type: application, service: web, deployment: { strategy: recreate }, readiness: { exec: "wget -qO- http://localhost:8080/", interval: 1s, start_period: 1s, within: 30s } }
deployment:
  order: [worker, web]
verification:
  - { exec: "wget -qO- http://localhost:8080/", component: web }
