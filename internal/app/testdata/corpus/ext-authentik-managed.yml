apiVersion: onebox.run/v1alpha1
kind: Application
metadata:
  name: authentik
spec:
  environments:
    production: {server: root@example.com}
  runtime:
    envFiles:
      - .env
      - {file: secrets/authentik.env, provider: Sops}
  workloads:
    server:
      role: Application
      strategy: Recreate
      image: ghcr.io/goauthentik/server:2026.5.6
      command: [server]
      routes:
        - {hostname: auth.example.com, port: 9000}
      needs: [{name: postgres, condition: Healthy}, {name: redis, condition: Healthy}]
      publishedPorts: [{host: 9000, container: 9000}, {host: 9443, container: 9443}]
      volumes:
        - {source: /srv/authentik/media, path: /media}
        - {source: ./custom-templates, path: /templates, mode: Ro}
      health: {exec: "ak healthcheck", interval: 30s, startPeriod: 60s, retries: 10}
    worker:
      role: Worker
      image: ghcr.io/goauthentik/server:2026.5.6
      command: [worker]
      needs: [{name: postgres, condition: Healthy}, {name: redis, condition: Healthy}]
      volumes:
        - {source: /var/run/docker.sock, path: /var/run/docker.sock}
        - {source: /srv/authentik/media, path: /media}
        - {source: /srv/authentik/certs, path: /certs}
  services:
    postgres: "16"
    redis: "7.4"
