api_version: onebox.run/v1
app: authentik
environments:
  production: {server: root@example.com}
workloads:
  server:
    role: application
    image: ghcr.io/goauthentik/server:2026.5.6
    command: [server]
    domain: auth.example.com
    port: 9000
    needs: [{name: postgresql, condition: healthy}]
    env_files: [.env]
    published_ports: [{host: 9000, container: 9000}, {host: 9443, container: 9443}]
    volumes:
      - {source: ./data, path: /data}
      - {source: ./custom-templates, path: /templates, mode: ro}
  worker:
    role: worker
    image: ghcr.io/goauthentik/server:2026.5.6
    command: [worker]
    needs: [{name: postgresql, condition: healthy}]
    env_files: [.env]
    volumes:
      - {source: /var/run/docker.sock, path: /var/run/docker.sock}
      - {source: ./data, path: /data}
      - {source: ./certs, path: /certs}
  postgresql:
    role: daemon
    image: docker.io/library/postgres:16-alpine
    health: {exec: "pg_isready -d authentik -U authentik", interval: 30s, start_period: 20s, retries: 5}
    volumes: [{name: database, path: /var/lib/postgresql/data}]
    env_files: [.env]
