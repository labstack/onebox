apiVersion: onebox.run/v1alpha1
kind: Application
metadata:
  name: authentik
spec:
  environments:
    production: {server: root@example.com}
  workloads:
    server:
      role: Application
      image: ghcr.io/goauthentik/server:2026.5.6
      command: [server]
      routes:
        - {hostname: auth.example.com, port: 9000}
      needs: [{name: postgresql, condition: Healthy}]
      envFiles: [.env]
      publishedPorts: [{host: 9000, container: 9000}, {host: 9443, container: 9443}]
      volumes:
        - {source: /srv/authentik/data, path: /data}
        - {source: ./custom-templates, path: /templates, mode: Ro}
    worker:
      role: Worker
      image: ghcr.io/goauthentik/server:2026.5.6
      command: [worker]
      needs: [{name: postgresql, condition: Healthy}]
      envFiles: [.env]
      volumes:
        - {source: /var/run/docker.sock, path: /var/run/docker.sock}
        - {source: /srv/authentik/data, path: /data}
        - {source: /srv/authentik/certs, path: /certs}
    postgresql:
      role: Daemon
      image: docker.io/library/postgres:16-alpine
      health: {exec: "pg_isready -d authentik -U authentik", interval: 30s, startPeriod: 20s, retries: 5}
      volumes: [{name: database, path: /var/lib/postgresql/data}]
      envFiles: [.env]
