apiVersion: onebox.run/v1alpha1
kind: Application
metadata:
  name: gitea
spec:
  environments:
    production: {server: root@example.com}
  workloads:
    server:
      role: Application
      strategy: Recreate
      image: docker.gitea.com/gitea:1.27.1
      routes:
        - {hostname: git.example.com, port: 3000}
      health: {http: /api/healthz, port: 3000, interval: 5s, startPeriod: 20s, within: 240s}
      publishedPorts: [{host: 222, container: 22, bind: "0.0.0.0"}]
      volumes: [{name: data, path: /data}]
      env:
        GITEA__database__DB_TYPE: postgres
        GITEA__database__HOST: "postgres:5432"
      needs:
        - name: postgres
          env:
            GITEA__database__NAME: database
            GITEA__database__USER: user
            GITEA__database__PASSWD: password
  services:
    postgres: 16
