apiVersion: onebox.run/v1alpha1
kind: Application
metadata:
  name: n8n
spec:
  environments:
    production:
      server: root@example.com
  workloads:
    n8n:
      role: Application
      routes:
        - {hostname: n8n.example.com, port: 5678}
      image: docker.n8n.io/n8nio/n8n:1.70.0
      health: {http: /healthz, port: 5678, interval: 3s, startPeriod: 10s, within: 180s}
      volumes: [{name: storage, path: /home/node/.n8n}]
      env:
        DB_TYPE: postgresdb
        EXECUTIONS_MODE: queue
      needs:
        - name: postgres
          env:
            DB_POSTGRESDB_HOST: host
            DB_POSTGRESDB_PORT: port
            DB_POSTGRESDB_DATABASE: database
            DB_POSTGRESDB_USER: user
            DB_POSTGRESDB_PASSWORD: password
        - name: redis
          env:
            QUEUE_BULL_REDIS_HOST: host
            QUEUE_BULL_REDIS_PORT: port
            QUEUE_BULL_REDIS_PASSWORD: password
  services:
    postgres: 16
    redis: "7.4"
