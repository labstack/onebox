apiVersion: onebox.run/v1alpha1
kind: Application
metadata:
  name: paperless
spec:
  environments:
    production: {server: root@example.com}
  workloads:
    webserver:
      role: Application
      image: ghcr.io/paperless-ngx/paperless-ngx:2.14.7
      routes:
        - {hostname: paperless.example.com, port: 8000}
      # Bare names: the loader waits for health where the dependency declares a
      # check and for start where it does not. gotenberg and tika declare none.
      needs: [db, broker, gotenberg, tika]
      envFiles: [docker-compose.env]
      publishedPorts: [{host: 8000, container: 8000}]
      volumes:
        - {name: data, path: /usr/src/paperless/data}
        - {name: media, path: /usr/src/paperless/media}
    broker:
      role: Daemon
      image: docker.io/valkey/valkey:9-alpine
      volumes: [{name: redisdata, path: /data}]
    db:
      role: Daemon
      image: docker.io/library/postgres:18
      volumes: [{name: pgdata, path: /var/lib/postgresql}]
      env: {POSTGRES_DB: paperless, POSTGRES_USER: paperless}
    gotenberg:
      role: Daemon
      image: docker.io/gotenberg/gotenberg:8.34
      command: [gotenberg, "--chromium-disable-javascript=true"]
    tika:
      role: Daemon
      image: docker.io/apache/tika:latest
