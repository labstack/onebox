# Deployed and verified against managed services on a throwaway host.
api_version: onebox.run/v1
app: plausible
environments:
  production: {server: root@example.com}
workloads:
  plausible:
    role: application
    image: ghcr.io/plausible/community-edition:v3.0.1
    domain: stats.example.com
    port: 8000
    health: {exec: ["/bin/sh", "-c", "wget -qO- http://127.0.0.1:8000/api/health || exit 1"], interval: 5s, start_period: 40s, within: 300s}
    volumes: [{name: data, path: /var/lib/plausible}]
    env:
      BASE_URL: "http://stats.example.com"
      SECRET_KEY_BASE: "0123456789012345678901234567890123456789012345678901234567890123"
      TOTP_VAULT_KEY: "CHANGE-ME-openssl-rand-base64-32"
    needs:
      - name: postgres
        env: {DATABASE_URL: url}
      - name: events
        env: {CLICKHOUSE_DATABASE_URL: url}
  migrate:
    role: job
    image: ghcr.io/plausible/community-edition:v3.0.1
    command:
      - /bin/sh
      - -c
      - |
        set -e
        /entrypoint.sh db createdb
        /entrypoint.sh db migrate
        printf '{"schema_version":"onebox.run/job-result/v1alpha1","changed":true}' > "$ONEBOX_RESULT_FILE"
    data_effect: migration
    when: pre_release
    env:
      BASE_URL: "http://stats.example.com"
      SECRET_KEY_BASE: "0123456789012345678901234567890123456789012345678901234567890123"
      TOTP_VAULT_KEY: "CHANGE-ME-openssl-rand-base64-32"
    needs:
      - name: postgres
        env: {DATABASE_URL: url}
      - name: events
        env: {CLICKHOUSE_DATABASE_URL: url}
deployment: {migration_policy: expand-only}
services:
  postgres: 16
  events: {driver: clickhouse, version: "24.12"}
