apiVersion: onebox.run/v1alpha1
kind: Application
metadata:
  name: umami
spec:
  environments:
    production: {server: root@example.com}
  workloads:
    umami:
      role: Application
      image: ghcr.io/umami-software/umami:postgresql-v2.19.0
      routes:
        - {hostname: analytics.example.com, port: 3000}
      health: {exec: ["/usr/local/bin/node", "-e", "fetch('http://127.0.0.1:3000/api/heartbeat').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 5s, startPeriod: 20s, within: 240s}
      env: {APP_SECRET: throwaway-secret-for-this-test}
      needs:
        - name: postgres
          env: {DATABASE_URL: url}
  services:
    postgres: 15
