# Deployed and verified against managed services on a throwaway host.
api_version: onebox.run/v1
app: umami
environments:
  production: {server: root@example.com}
workloads:
  umami:
    role: application
    image: ghcr.io/umami-software/umami:postgresql-v2.19.0
    domain: analytics.example.com
    port: 3000
    health: {exec: ["/usr/local/bin/node", "-e", "fetch('http://127.0.0.1:3000/api/heartbeat').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 5s, start_period: 20s, within: 240s}
    env: {APP_SECRET: throwaway-secret-for-this-test}
    needs:
      - name: postgres
        env: {DATABASE_URL: url}
services:
  postgres: 15
