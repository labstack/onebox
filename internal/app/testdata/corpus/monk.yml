api_version: onebox.run/v1
app: monk
environments:
  production:
    server: root@monk.labstack.net
    policy: {require_approval: true, allow_agent_proposals: true}
workloads:
  server:
    role: application
    image: ghcr.io/labstack/monk-server:2026.8.1
    replicas: 3
    strategy: rolling
    domain: monk.trade
    port: 7500
    health:
      exec: "curl --fail --silent --show-error http://127.0.0.1:7500/healthz"
      interval: 10s
      start_period: 25s
      within: 3m
      retries: 5
    drain: {signal: TERM, grace: 30s}
  feed:
    role: worker
    image: ghcr.io/labstack/monk-feed:2026.8.1
    strategy: recreate
    drain: {signal: TERM, wait: 30s, grace: 30s}
  database:
    role: daemon
    compose: docker-compose.yaml#postgres
    persistence: {mode: durable}
  cache:
    role: daemon
    compose: docker-compose.yaml#redis
    persistence: {mode: durable}
  maintenance:
    role: daemon
    compose: docker-compose.yaml#ofelia
deployment: {order: [feed, server], retain_releases: 5}
runtime:
  env_files: [server/.env, server/.env.production]
  env_checks:
    - {file: traefik/.env, require: [CF_DNS_API_TOKEN]}
    - file: web/.env.production
      require: [VITE_STRIPE_PUBLISHABLE_KEY, VITE_GA_MEASUREMENT_ID]
      present: [VITE_VAPID_PUBLIC_KEY]
proxy: {managed: true, config: traefik}
notifications:
  ntfy: {webhook: "https://ntfy.sh/monk-deploy-f413efb2e8f7", on: [failure], format: text}
hooks:
  bootstrap: {run: 'scripts/bootstrap.sh "$OB_TARGET"', local: true}
  pre_release: {run: "cd web && bun install --frozen-lockfile && bun run build && rsync -az dist/ $OB_TARGET:/data/monk/web/", local: true}
  post_deploy: {run: "rsync -az web/dist/index.html $OB_TARGET:/data/monk/web/index.html", local: true}
verifications:
  - {workload: server, http: /healthz, port: 7500}
  - {url: "https://monk.trade/healthz", advisory: true}
  - {url: "https://monk.trade/", contains: 'id="root"', advisory: true}
