api_version: onebox.run/v1
app: plausible
environments:
  production: {server: root@example.com}
files:
  - clickhouse/logs.xml
  - clickhouse/ipv4-only.xml
  - clickhouse/low-resources.xml
workloads:
  plausible:
    role: application
    image: ghcr.io/plausible/community-edition:v3.2.1
    domain: stats.example.com
    port: 8000
    needs: [{name: plausible-db, condition: healthy}, {name: events-db, condition: healthy}]
    volumes: [{name: data, path: /var/lib/plausible}]
  plausible-db:
    role: daemon
    image: postgres:16-alpine
    health: {exec: "pg_isready -U postgres", start_period: 1m}
    volumes: [{name: db-data, path: /var/lib/postgresql/data}]
  events-db:
    role: daemon
    compose: compose.yml#plausible_events_db
    persistence: {mode: durable}
