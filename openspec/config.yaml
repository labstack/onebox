schema: spec-driven

context: |
  Onebox is an LLM-first production-operations product for containerized
  applications intentionally running as the sole Onebox application on one
  active Linux host. Go is the
  implementation language. The host is reached over SSH and the execution
  engine owns locks, fencing, journals, state-bound plans, approval
  validation, verification, and recovery gates.

  Ownership boundary: the user owns the host, provisioning, application data,
  and application containers. Onebox owns the release state, locks, journals,
  generated runtime, and any host proxy or supporting services it explicitly
  manages. Onebox currently runs supporting services without a native backup
  or restore contract. Migration gates may consume plan-bound backup reports
  about artifacts created and checked by the operator or external tooling;
  those reports do not make Onebox the backup provider.

  The project file is the authoring contract. Its closed, versioned schema is
  the typed model the loader decodes into, with grammars and enums declared in
  one table beside the message each violation produces, and a JSON Schema
  published from the same declarations for editors. Docker Compose is a
  generated runtime artifact, not a user-authored input; a bounded per-workload escape hatch admits raw Compose
  for containers the declaration cannot express. Driver-backed services are
  never user-authored: a hand-authored data service is a workload and is not
  reported as managed.

  Supporting services carry an explicit tier. A managed service is pinned,
  sized to observed host resources, health-verified with driver-specific
  semantics, backed up, and restore-drilled. A run service is pinned,
  persisted, health-gated, capped, and observed, with no backup contract that
  it must state plainly. A capability is never presented as running because it
  was declared.

  The coding agent is the normal user interface and it operates Onebox through
  the CLI. The CLI is therefore the product interface, not a non-primary
  adapter: every executable leaf has a closed output protocol, finite and
  streaming machine results are versioned, and errors are typed. Guidance
  distinguishes read-only diagnostic commands, workflow-next commands, and
  commands that can actually resolve a condition. Lifecycle mutations are
  idempotent under retry. Passthrough commands state their weaker guarantees.
  Lifecycle behavior lives in the canonical Go service, never in the adapter.

  Documentation status is explicit. Archived contracts under openspec/specs/
  define required shipped behavior. README.md and the current schema and CLI
  guides describe implemented behavior. Active OpenSpec changes describe
  proposed behavior only. docs/product.md states product direction.

  Safety invariants: model text is never approval. The shipped `ob approve`
  ceremony records a short-lived local human confirmation bound to one exact
  plan; its digest detects modification but is not authenticated identity or
  proof that the requesting actor could not mint it. Plaintext secrets never
  enter plans, model context, journals, or public errors; passthrough logs and
  exec output are explicitly outside that redaction claim. Read operations
  never converge; lifecycle mutations require exact state binding and the
  confirmation class policy requires; an override cannot manufacture safety;
  failures preserve data and honest recovery choices; unsupported behavior
  fails closed.

rules:
  proposal:
    - State what is implemented today and what remains proposed.
    - Name user-visible compatibility, ownership, and documentation effects.
    - Include explicit non-goals for destructive, data, upgrade, and provider-specific behavior.
    - State the service tier a change establishes or graduates, and the evidence required for graduation.
  specs:
    - Use normative SHALL requirements with observable Given/When/Then scenarios.
    - Cover agent retries, disconnections, stale state, incomplete evidence, redaction, cancellation, and crash recovery where relevant.
    - Never treat model-authored text as approval or secret authority.
    - Specify structured CLI output, typed error codes, and semantically distinct diagnostic, next-step, and resolving commands for any agent-facing surface.
  design:
    - Keep the CLI as the only adapter and the canonical Go service as the only behavior authority.
    - Document default precedence, effective-value origins, version compatibility, failure atomicity, persistence ownership, and recovery limits.
    - Show what is generated, how it is inspected, and how ownership is handed back.
    - Resolve safety-affecting questions before tasks are written.
    - Cite authoritative upstream behavior when external systems affect the contract.
  tasks:
    - Order tasks by dependency and keep a service at its stated tier until its graduation evidence passes.
    - Make each task independently verifiable with named tests or an observable exit condition.
    - Include documentation status updates and strict OpenSpec validation before archive.

operations:
  apply:
    guidance:
      - Read proposal, specs, design, and tasks before implementation.
      - Implement through the canonical service before exposing CLI adapters.
      - Keep generated runtime artifacts inspectable and ejectable at every step.
      - Run focused tests after each task group and fault-oriented validation before a service graduates tier.
  archive:
    guidance:
      - Update current schema and CLI documentation only for behavior that actually shipped.
      - Confirm no proposed capability remains described as implemented.
      - Confirm no service is reported as managed without passing backup and restore-drill evidence.
      - Record deferred provider, destructive, backup, restore, adoption, and upgrade contracts as separate changes.
